[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-btc-bot"
version = "0.2.0"
description = "Institutional Kalshi BTC 1-hour forecasting engine (EV-max, accuracy-first, NO TRADE default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "httpx>=0.27",
  "websockets>=12.0",
  "yfinance>=0.2.40",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
kalshi-bot = "kalshi_bot.main:main"
kalshi-forecast = "kalshi_bot.cli:forecast_main"
kalshi-scan = "kalshi_bot.cli:scan_main"
kalshi-demo = "kalshi_bot.cli:demo_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
