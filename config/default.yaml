# Production platform — live data, execution gated by platform.trading_enabled
platform:
  trading_enabled: true
  model_version: production-v1
  candidate_model_version: null
  daily_loss_limit_usd: 50.0
  enable_kxbtc15m: true
  enable_kxbtcd: false
  max_data_age_seconds: 12.0
  enable_settlement_ingestion: false
  enable_settlement_model: false
  enable_vol_regime: false

# Arbitrary policy — hourly bot only (15m uses mispricing pipeline)
arbitrary:
  enabled: false

# CF Benchmarks BRTI — primary: https://www.cfbenchmarks.com/data/indices/BRTI
# Fallbacks: Kalshi /cfbenchmarks passthrough → licensed API → exchange proxies
brti:
  index_id: BRTI
  prefer_official: true
  public_summary_enabled: true
  allow_exchange_proxy: true

series:
  - ticker: KXBTCD
    enabled: true
    min_edge_pp: 20.0
    max_contracts: 400
    max_notional_usd: 200.0
  - ticker: KXBTC15M
    enabled: true
    min_edge_pp: 25.0
    max_contracts: 5
    max_notional_usd: 3.5

risk:
  bankroll_usd: 4.0
  kelly_fraction: 0.15
  max_open_positions: 2
  max_exposure_usd: 3.5
  max_loss_per_trade_usd: 3.0
  cooldown_seconds: 5.0
  min_seconds_to_expiry: 60.0
  max_seconds_to_expiry_15m: 840
  # Hourly markets: execute only in the last 20 minutes (skip first ~40m).
  max_seconds_to_expiry_1h: 1200

forecast_gates:
  min_confidence: 0.70
  max_disagreement_pp: 8.0
  min_edge_pp: 20.0
  max_spread: 0.05
  min_volume: 50.0
  min_seconds_to_expiry: 120.0
  # Last-20-minute entry window only (do not trade earlier in the hour).
  max_seconds_to_expiry: 1200
  hourly_only: true
  proxy_spot_edge_multiplier: 1.5
  proxy_spot_confidence_penalty: 0.30
  deep_itm_buffer_usd: 25.0
  deep_itm_extra_edge_pp: 8.0

# Gap tiers: gap_pp = (model_probability − market_price) × 100
# At model=60%: 35¢/25pp & 40¢/20pp → Strong BUY; 45¢/15pp → conditional; ≤50¢/10pp → No trade
bot_action:
  strong_buy_min_gap_pp: 25.0
  conditional_min_gap_pp: 20.0
  conditional_min_confidence: 0.75
  conditional_max_disagreement_pp: 5.0

# Kalshi BTC 15-Min Intelligence V6 (activated workflow)
# Trading rules live in config/rules_15m.yaml (cleared by default).
v6:
  enabled: true
  series_ticker: KXBTC15M
  live_trading_enabled: true
  min_trades_per_bucket: 3
  monte_carlo_sims: 5000
  journal_path: data/v6_trade_journal.db
  diagnostics_db_path: data/diagnostics/evaluations.db
  bankroll_usd: 4.0
  kelly_fraction: 0.12
  max_position_usd: 3.5
  max_exposure_usd: 3.5
  max_daily_loss_usd: 3.0
  max_consecutive_losses: 4
  cooldown_after_loss_seconds: 120.0
  min_seconds_to_expiry: 60.0
  max_seconds_to_expiry: 840.0
  min_open_seconds: 30.0

smile:
  symbol: IBIT
  min_oi: 10
  min_volume: 0
  max_spread_pct: 0.35
  max_smile_age_seconds: 21600
  stale_edge_multiplier: 1.75
  cache_path: data/cache/ibit_smile.json
  prefer_expiries: 4
  risk_free_rate: 0.045
  dividend_yield: 0.0

execution:
  mode: live
  time_in_force: immediate_or_cancel
  use_taker: true
  price_improve_ticks: 0
  dry_run: false

# Pre-expiry exits: cut losers and bail when model edge flips against the position
exit:
  enabled: true
  max_drawdown_pct: 0.45
  exit_on_edge_flip: true
  min_seconds_to_expiry: 30.0
  series_tickers:
    - KXBTC15M
    - KXBTCD

# Paper trading default — set live_trading_enabled: true AND execution.mode: live to trade real money

scan_interval_seconds: 2.0
fee_rate: 0.07
fee_multiplier: 1.0
