# KXBTC15M mispricing bot — finds calibrated settlement prob vs executable Kalshi price.
# NOT up/down prediction: every trade requires net edge after fees, spread, slippage, risk.

enabled: true
mode: mispricing

# Arbitrary policy OFF — use mispricing pipeline only
arbitrary:
  enabled: false

# Legacy tier thresholds OFF (null = disabled)
tiers:
  enabled_for_live: false
  edge_exceptional: null
  edge_strong: null
  edge_conditional: null
  edge_experimental: null

strict_edge:
  min_gap_dollars: null

bot_action: {}

quality:
  max_spread: 0.08
  min_liquidity_score: 0.15
  max_model_disagreement_pp: 25.0
  require_pattern_evidence: false
  min_pattern_examples: null
  stale_data_stop_trading: true

# Per-side gate checklist (dashboard + trade readiness)
gates:
  min_minutes_to_expiry: 0.5
  max_minutes_to_expiry: 12.0
  uncertainty_cap: 0.10
  yes_alignment_min_forecast: 0.50
  no_alignment_min_crowd_pct: 0.52

# Time-bucket edge floors (strategy tightens/loosens by minutes remaining)
time_buckets:
  "15_10":
    min_net_edge_dollars: 0.18
    min_raw_edge_dollars: 0.22
    size_multiplier: 0.60
  "10_7":
    min_net_edge_dollars: 0.15
    min_raw_edge_dollars: 0.19
    size_multiplier: 0.75
  "7_5":
    min_net_edge_dollars: 0.13
    min_raw_edge_dollars: 0.17
    size_multiplier: 0.85
  "5_3":
    min_net_edge_dollars: 0.11
    min_raw_edge_dollars: 0.15
    size_multiplier: 1.0
  "3_1":
    min_net_edge_dollars: 0.09
    min_raw_edge_dollars: 0.13
    size_multiplier: 0.70
