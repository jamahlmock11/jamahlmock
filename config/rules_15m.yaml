# KXBTC15M ONLY — 15-minute mispricing rules.
# forecast_gates, bot_action, and arbitrary in config/default.yaml apply to KXBTCD hourly only.

enabled: true
mode: mispricing

# Arbitrary policy OFF — use mispricing pipeline only
arbitrary:
  enabled: false

# Legacy tier thresholds OFF (null = disabled)
tiers:
  enabled_for_live: false
  edge_exceptional: null
  edge_strong: null
  edge_conditional: null
  edge_experimental: null

strict_edge:
  min_gap_dollars: null

bot_action: {}

# 15m execution — single decision path via filter_trade (no stacked ensemble veto by default)
min_ensemble_agreement: null
require_gates_for_execution: false

quality:
  max_spread: 0.08
  min_liquidity_score: 0.15
  max_model_disagreement_pp: 25.0
  require_pattern_evidence: false
  min_pattern_examples: null
  stale_data_stop_trading: true

# Dashboard gate checklist (display-only unless require_gates_for_execution: true)
gates:
  min_minutes_to_expiry: 1.0
  max_minutes_to_expiry: 14.0
  uncertainty_cap: 0.10
  yes_alignment_min_forecast: 0.50
  no_alignment_min_crowd_pct: 0.52

# Time-bucket edge floors (aligned with code defaults)
time_buckets:
  "15_10":
    min_net_edge_dollars: 0.14
    min_raw_edge_dollars: 0.18
    size_multiplier: 0.60
  "10_7":
    min_net_edge_dollars: 0.12
    min_raw_edge_dollars: 0.16
    size_multiplier: 0.75
  "7_5":
    min_net_edge_dollars: 0.10
    min_raw_edge_dollars: 0.14
    size_multiplier: 0.85
  "5_3":
    min_net_edge_dollars: 0.08
    min_raw_edge_dollars: 0.12
    size_multiplier: 1.0
  "3_1":
    min_net_edge_dollars: 0.06
    min_raw_edge_dollars: 0.10
    size_multiplier: 0.70
